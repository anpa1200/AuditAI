name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev,ai]"
      - run: pytest
      - run: ruff check --isolated --select E4,E7,E9,F .
      - run: python -m pip install build && python -m build

  debian-package:
    runs-on: ubuntu-latest
    container: debian:testing-slim
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y build-essential debhelper dh-python pybuild-plugin-pyproject python3-all python3-click python3-pytest python3-requests python3-setuptools lintian
      - run: dpkg-buildpackage -us -uc -b
      - run: lintian ../auditai_*_all.deb
